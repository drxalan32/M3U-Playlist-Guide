name: M3U validator tests

on:
  push:
    paths:
      - "docs/tools/m3u-validator.html"
      - "tests/test_m3u_validator.js"
      - ".github/workflows/validator-tests.yml"
  workflow_dispatch:

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validator sample tests
        run: node tests/test_m3u_validator.js
