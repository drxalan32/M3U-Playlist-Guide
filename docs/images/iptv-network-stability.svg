<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t d"><title id="t">IPTV home network connection diagram</title><desc id="d">A router connects to a streaming device using Wi-Fi or Ethernet. Stability can be affected by distance, walls, network traffic and device capability.</desc><rect width="960" height="390" rx="24" fill="#071b49"/><text x="48" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Your home network: where stability matters</text><g font-family="Arial,sans-serif"><rect x="65" y="138" width="190" height="140" rx="18" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><path d="M119 198q41-43 82 0M132 212q28-29 56 0M151 228q9-10 18 0" fill="none" stroke="#4cc9f0" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="243" r="5" fill="#4cc9f0"/><text x="160" y="263" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Router</text><rect x="390" y="138" width="190" height="140" rx="18" fill="#10396e" stroke="#ff9a24" stroke-width="2"/><rect x="450" y="182" width="70" height="42" rx="7" fill="none" stroke="#fff" stroke-width="3"/><path d="M460 235h50" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="485" y="263" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Connection</text><rect x="715" y="138" width="180" height="140" rx="18" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><rect x="773" y="174" width="64" height="47" rx="5" fill="none" stroke="#fff" stroke-width="3"/><path d="M794 230h22M805 221v9" stroke="#fff" stroke-width="3"/><text x="805" y="263" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">TV / Player</text><path d="M255 208h135M580 208h135" stroke="#4cc9f0" stroke-width="4" stroke-linecap="round"/><path d="M377 199l13 9-13 9M702 199l13 9-13 9" fill="none" stroke="#4cc9f0" stroke-width="4"/><text x="322" y="184" text-anchor="middle" fill="#b9d9f5" font-size="14">Wi-Fi or Ethernet</text><text x="647" y="184" text-anchor="middle" fill="#b9d9f5" font-size="14">Stable local link</text><text x="65" y="326" fill="#ffbd66" font-size="15">Improve reliability: reduce distance and walls, pause heavy downloads, test near the device.</text><text x="65" y="353" fill="#b9d9f5" font-size="14">Ethernet can reduce wireless interference, but cannot fix an upstream outage or source-side issue.</text></g></svg>