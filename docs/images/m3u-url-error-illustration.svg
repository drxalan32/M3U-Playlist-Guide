<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Illustrative M3U playlist URL error screen</title><desc id="desc">A generic playlist settings panel with a masked URL and a message to check the URL. This is an illustration, not a screenshot from a specific app.</desc>
