<rect width="1200" height="620" rx="26" fill="url(#bg)"/><rect x="52" y="52" width="1096" height="516" rx="22" fill="#fff" filter="url(#shadow)"/>
<circle cx="104" cy="106" r="19" fill="#1264d6"/><path d="M98 96v20l17-10z" fill="#fff"/><text x="142" y="115" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">Playlist settings</text>
<text x="100" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">M3U playlist URL</text>
<rect x="100" y="215" width="1000" height="82" rx="12" fill="#f8fafc" stroke="#d53c3c" stroke-width="3"/>
<path d="M143 252h35m-18-18-18 18 18 18" stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="214" y="246" width="615" height="20" rx="5" fill="#26364b"/><rect x="842" y="246" width="145" height="20" rx="5" fill="#26364b"/>
<path d="M1044 237l24 43h-48z" fill="#f59e0b"/><path d="M1044 250v14m0 7v1" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="100" y="350" font-family="Arial,sans-serif" font-size="25" fill="#b42318">The playlist could not be loaded.</text>
<text x="100" y="390" font-family="Arial,sans-serif" font-size="19" fill="#475569">Check the full URL and confirm that the source is still active.</text>
