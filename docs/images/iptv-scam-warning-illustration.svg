<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Subscription warning signs</title><desc id="d">A warning panel showing caution symbols for pressure tactics, unclear business details and unsafe payment requests.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#10203c"/><stop offset="1" stop-color="#754b36"/></linearGradient></defs><rect width="1200" height="560" rx="28" fill="url(#g)"/><g transform="translate(110 95)"><path d="M160 0L315 280H5z" fill="#ffd28a"/><path d="M160 80v105m0 45v8" stroke="#70451b" stroke-width="22" stroke-linecap="round"/></g><g fill="#fff" font-family="Arial,sans-serif"><text x="500" y="135" font-size="32" font-weight="700">Pause before you pay</text><text x="500" y="215" font-size="23">• Unclear company identity or contact details</text><text x="500" y="280" font-size="23">• Pressure to pay immediately</text><text x="500" y="345" font-size="23">• Unusual payment or credential requests</text><text x="500" y="410" font-size="23">• Modified apps or disabled security</text><text x="110" y="495" font-size="20" opacity=".85">Verify independently; a polished website is not proof of trustworthiness</text></g></svg>