<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t d"><title id="t">IPTV device compatibility checklist</title><desc id="d">Before choosing a device, verify its exact model, operating system, app store availability in your region, and provider support.</desc><rect width="960" height="390" rx="24" fill="#071b49"/><text x="48" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Check compatibility before you buy or install</text><g font-family="Arial,sans-serif"><g transform="translate(58 122)"><rect width="190" height="148" rx="16" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><rect x="64" y="25" width="62" height="48" rx="5" fill="none" stroke="#fff" stroke-width="3"/><path d="M82 82h26M95 73v9" stroke="#fff" stroke-width="3"/><text x="95" y="112" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Smart TV</text><text x="95" y="133" text-anchor="middle" fill="#cce7ff" font-size="12">Brand + model</text></g><g transform="translate(278 122)"><rect width="190" height="148" rx="16" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><rect x="75" y="22" width="40" height="62" rx="10" fill="none" stroke="#fff" stroke-width="3"/><circle cx="95" cy="74" r="2" fill="#fff"/><text x="95" y="112" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Phone / tablet</text><text x="95" y="133" text-anchor="middle" fill="#cce7ff" font-size="12">OS + app region</text></g><g transform="translate(498 122)"><rect width="190" height="148" rx="16" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><rect x="70" y="34" width="50" height="32" rx="7" fill="none" stroke="#fff" stroke-width="3"/><path d="M80 75h30" stroke="#fff" stroke-width="3"/><text x="95" y="112" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Streaming box</text><text x="95" y="133" text-anchor="middle" fill="#cce7ff" font-size="12">Hardware + updates</text></g><g transform="translate(718 122)"><rect width="184" height="148" rx="16" fill="#10396e" stroke="#ff9a24" stroke-width="2"/><path d="M72 36h40v32H72zM80 28h24M80 76h24" fill="none" stroke="#fff" stroke-width="3"/><text x="92" y="112" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Provider app</text><text x="92" y="133" text-anchor="middle" fill="#cce7ff" font-size="12">Official support</text></g></g><text x="58" y="318" fill="#ffbd66" font-family="Arial,sans-serif" font-size="16" font-weight="700">Confirm all four before subscribing:</text><text x="58" y="348" fill="#cce7ff" font-family="Arial,sans-serif" font-size="15">Exact model • operating-system version • regional app availability • provider sign-in support</text></svg>