<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Android TV setup overview</title><desc id="d">Television interface with app tiles, a streaming device and a checklist for safe setup.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#10203c"/><stop offset="1" stop-color="#166b70"/></linearGradient></defs><rect width="1200" height="560" rx="28" fill="url(#g)"/><rect x="90" y="85" width="650" height="365" rx="24" fill="#0b1425" stroke="#9ce5d8" stroke-width="9"/><rect x="115" y="110" width="600" height="315" rx="12" fill="#eafaf7"/><text x="155" y="165" fill="#173b48" font-family="Arial,sans-serif" font-size="27" font-weight="700">Your apps</text><g><rect x="155" y="200" width="145" height="125" rx="18" fill="#c7f0e7"/><rect x="325" y="200" width="145" height="125" rx="18" fill="#d8e8ff"/><rect x="495" y="200" width="145" height="125" rx="18" fill="#fce7c3"/><path d="M210 235l45 27-45 27z" fill="#12806f"/><circle cx="397" cy="262" r="34" fill="#1264d6"/><path d="M380 262h34m-17-17v34" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M530 245h75v34h-75z" fill="#d97706"/><text x="155" y="370" fill="#526477" font-family="Arial,sans-serif" font-size="18">Install only from trusted sources</text><path d="M740 270h100" stroke="#9ce5d8" stroke-width="7" stroke-dasharray="12 12"/><g fill="#fff" font-family="Arial,sans-serif"><text x="865" y="120" font-size="30" font-weight="700">Safe setup checklist</text><text x="865" y="190" font-size="22">✓ Confirm device model</text><text x="865" y="245" font-size="22">✓ Check Google Play listing</text><text x="865" y="300" font-size="22">✓ Review app permissions</text><text x="865" y="355" font-size="22">✓ Follow official instructions</text><text x="90" y="510" font-size="20" opacity=".8">Android TV and Google TV support can differ by device</text></g></svg>