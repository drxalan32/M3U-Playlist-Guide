<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">IPTV buffering troubleshooting flowchart</title><desc id="d">Check whether all streams buffer or only one. If all, investigate network, device and app. If one, compare another stream and contact the source provider.</desc><rect width="960" height="430" rx="24" fill="#071b49"/><text x="48" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Find where buffering starts</text><text x="48" y="88" fill="#b9d9f5" font-family="Arial,sans-serif" font-size="16">Change one thing at a time so you can identify the cause.</text><g font-family="Arial,sans-serif"><rect x="330" y="122" width="300" height="72" rx="16" fill="#0c5ca8" stroke="#4cc9f0" stroke-width="2"/><text x="480" y="151" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Do all streams buffer?</text><text x="480" y="176" text-anchor="middle" fill="#d9f2ff" font-size="14">Compare more than one channel or source</text><path d="M480 194v34H240v34M480 228h240v34" fill="none" stroke="#4cc9f0" stroke-width="3"/><path d="M233 254l7 10 7-10M713 254l7 10 7-10" fill="none" stroke="#4cc9f0" stroke-width="3"/><rect x="58" y="264" width="365" height="112" rx="16" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><text x="82" y="294" fill="#7ce1ff" font-size="16" font-weight="700">YES — many or all streams</text><text x="82" y="324" fill="#fff" font-size="16">Check Wi-Fi / Ethernet, other traffic,</text><text x="82" y="348" fill="#fff" font-size="16">device performance and app updates.</text><rect x="537" y="264" width="365" height="112" rx="16" fill="#10396e" stroke="#ff9a24" stroke-width="2"/><text x="561" y="294" fill="#ffbd66" font-size="16" font-weight="700">NO — one or a few streams</text><text x="561" y="324" fill="#fff" font-size="16">Compare other streams and times;</text><text x="561" y="348" fill="#fff" font-size="16">ask the source provider to investigate.</text></g><text x="48" y="407" fill="#b9d9f5" font-family="Arial,sans-serif" font-size="14">A diagnostic guide, not a guarantee of provider performance.</text></svg>