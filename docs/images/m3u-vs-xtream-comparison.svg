<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d"><title id="t">M3U URL compared with Xtream Codes-style login</title><desc id="d">M3U uses a playlist URL or local file. Xtream-style login uses server address, username and password. Both require a compatible app and authorised source.</desc><rect width="960" height="380" rx="24" fill="#071b49"/><text x="48" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Two connection methods, different inputs</text><g font-family="Arial,sans-serif"><rect x="60" y="105" width="390" height="190" rx="18" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><text x="90" y="143" fill="#7ce1ff" font-size="23" font-weight="700">M3U playlist</text><rect x="90" y="163" width="330" height="48" rx="9" fill="#071b49" stroke="#4cc9f0"/><text x="108" y="193" fill="#fff" font-size="16">Playlist URL or local .m3u file</text><text x="90" y="245" fill="#cce7ff" font-size="15">The app reads playlist text and entries.</text><text x="90" y="270" fill="#cce7ff" font-size="15">May contain channel metadata and URLs.</text><rect x="510" y="105" width="390" height="190" rx="18" fill="#10396e" stroke="#ff9a24" stroke-width="2"/><text x="540" y="143" fill="#ffbd66" font-size="23" font-weight="700">Xtream-style login</text><g fill="#071b49" stroke="#ff9a24"><rect x="540" y="163" width="330" height="31" rx="7"/><rect x="540" y="202" width="155" height="31" rx="7"/><rect x="715" y="202" width="155" height="31" rx="7"/></g><g fill="#fff" font-size="14"><text x="554" y="184">Server / portal address</text><text x="554" y="223">Username</text><text x="729" y="223">Password</text></g><text x="540" y="260" fill="#cce7ff" font-size="15">The app uses account details via a</text><text x="540" y="281" fill="#cce7ff" font-size="15">supported service interface.</text></g><text x="60" y="337" fill="#ffbd66" font-family="Arial,sans-serif" font-size="16">Use only the method your provider and player both support. Never share credentials publicly.</text></svg>