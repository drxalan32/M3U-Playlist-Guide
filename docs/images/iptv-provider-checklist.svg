<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="t d"><title id="t">IPTV provider checks before paying</title><desc id="d">A pre-purchase checklist covering content rights, full price and renewal, device compatibility, support, privacy and cancellation terms.</desc><rect width="960" height="410" rx="24" fill="#071b49"/><text x="48" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Before you pay: verify the essentials</text><text x="48" y="88" fill="#b9d9f5" font-family="Arial,sans-serif" font-size="16">A professional-looking website or working app is not proof of authorisation.</text><g font-family="Arial,sans-serif" font-size="18" fill="#fff"><g transform="translate(58 128)"><rect width="405" height="74" rx="14" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><circle cx="38" cy="37" r="18" fill="#0864ed"/><path d="M29 37l7 7 13-15" fill="none" stroke="#fff" stroke-width="3"/><text x="72" y="33" font-weight="700">Content rights + regional availability</text><text x="72" y="55" fill="#cce7ff" font-size="13">Ask who operates the service and what it is authorised to show.</text></g><g transform="translate(497 128)"><rect width="405" height="74" rx="14" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><circle cx="38" cy="37" r="18" fill="#0864ed"/><path d="M29 37l7 7 13-15" fill="none" stroke="#fff" stroke-width="3"/><text x="72" y="33" font-weight="700">Full price + renewal terms</text><text x="72" y="55" fill="#cce7ff" font-size="13">Check billing frequency, extra costs, refunds and cancellation.</text></g><g transform="translate(58 220)"><rect width="405" height="74" rx="14" fill="#10396e" stroke="#4cc9f0" stroke-width="2"/><circle cx="38" cy="37" r="18" fill="#0864ed"/><path d="M29 37l7 7 13-15" fill="none" stroke="#fff" stroke-width="3"/><text x="72" y="33" font-weight="700">Device + app compatibility</text><text x="72" y="55" fill="#cce7ff" font-size="13">Confirm exact models, app sources and connection methods.</text></g><g transform="translate(497 220)"><rect width="405" height="74" rx="14" fill="#10396e" stroke="#ff9a24" stroke-width="2"/><circle cx="38" cy="37" r="18" fill="#0864ed"/><path d="M29 37l7 7 13-15" fill="none" stroke="#fff" stroke-width="3"/><text x="72" y="33" font-weight="700">Support + privacy</text><text x="72" y="55" fill="#cce7ff" font-size="13">Find real support channels and read the privacy policy.</text></g></g><text x="58" y="350" fill="#ffbd66" font-family="Arial,sans-serif" font-size="16" font-weight="700">Pause if key answers are missing or payment pressure feels unusual.</text></svg>