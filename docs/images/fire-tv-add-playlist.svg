<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Add your authorised connection</title><desc id="desc">An illustrative player setup screen showing generic M3U and Xtream-style options without real credentials.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061b3b"/><stop offset=".58" stop-color="#0b4678"/><stop offset="1" stop-color="#071b49"/></linearGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#102d50"/><stop offset="1" stop-color="#071426"/></linearGradient><linearGradient id="cyan" x2="1"><stop stop-color="#0ba8e8"/><stop offset="1" stop-color="#4cc9f0"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter></defs>
<rect width="1200" height="675" rx="34" fill="url(#bg)"/><circle cx="980" cy="80" r="210" fill="#13a8e8" opacity=".13" filter="url(#shadow)"/><path d="M0 540Q260 460 520 570T1200 500V675H0Z" fill="#0a2e55" opacity=".65"/>
<text x="68" y="82" fill="#75dfff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">STEP 03</text>
<text x="68" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Add your authorised connection</text>
<rect x="115" y="195" width="970" height="365" rx="24" fill="url(#screen)" stroke="#39749a" stroke-width="3"/><text x="165" y="250" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Add playlist or account</text><rect x="165" y="285" width="405" height="75" rx="14" fill="#0b78b2"/><text x="367" y="332" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25" font-weight="700">M3U PLAYLIST</text><rect x="610" y="285" width="425" height="75" rx="14" fill="#153b5c" stroke="#4cc9f0" stroke-width="2"/><text x="822" y="332" text-anchor="middle" fill="#dff7ff" font-family="Arial" font-size="25" font-weight="700">XTREAM-STYLE LOGIN</text><text x="165" y="415" fill="#b9d8ed" font-family="Arial" font-size="22">Use only the method your provider supplied</text><rect x="165" y="445" width="870" height="58" rx="12" fill="#071a31" stroke="#356887"/><text x="195" y="482" fill="#7da9c5" font-family="Arial" font-size="22">Enter your private details in the compatible app</text>
<text x="68" y="630" fill="#a8c9e2" font-family="Arial,sans-serif" font-size="19">Illustrative guide artwork · Fire TV menus and app availability may vary</text>
