<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">IPTV guide across connected devices</title>
<desc id="desc">A modern television displaying a neutral programme interface, with a streaming device, remote control and connected mobile screen.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10203c"/><stop offset=".55" stop-color="#174d78"/><stop offset="1" stop-color="#167b79"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d3557"/><stop offset="1" stop-color="#0c1729"/></linearGradient>
 <linearGradient id="tile1"><stop stop-color="#65c5bd"/><stop offset="1" stop-color="#2c7892"/></linearGradient>
 <linearGradient id="tile2"><stop stop-color="#e8b66b"/><stop offset="1" stop-color="#b96c59"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#061426" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="820" rx="42" fill="url(#bg)"/>
<circle cx="1010" cy="145" r="170" fill="#b4eee0" opacity=".08"/><circle cx="190" cy="690" r="210" fill="#b4eee0" opacity=".07"/>
<g opacity=".24" stroke="#c9fff0" stroke-width="2" fill="none"><path d="M70 190h190m-130 28h130M900 680h210m-150 28h150"/><circle cx="1030" cy="320" r="54"/><circle cx="1030" cy="320" r="80"/></g>
