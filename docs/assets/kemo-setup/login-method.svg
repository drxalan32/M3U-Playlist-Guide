<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Choose Xtream Codes API</title><desc id="desc">Illustrative app screen highlighting the Xtream Codes API sign-in method.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f6ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1169df"/><stop offset="1" stop-color="#1644a4"/></linearGradient></defs><rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="64" y="74" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3" fill="#087c78">KEMO IPTV • HOW TO SET UP</text><text x="64" y="145" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14233d">STEP 1  •  SELECT YOUR LOGIN METHOD</text><rect x="64" y="190" width="1072" height="400" rx="16" fill="#fff" stroke="#dce6f2" stroke-width="2"/><rect x="110" y="245" width="980" height="95" rx="16" fill="#edf5ff" stroke="#9fc2f4" stroke-width="2"/><text x="150" y="302" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1169df">✓</text><text x="215" y="285" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Login with Xtream Codes API</text><text x="215" y="322" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#60748f">Use the server URL, username and password supplied by your provider</text><rect x="110" y="365" width="980" height="85" rx="16" fill="#fff" stroke="#dce6f2" stroke-width="2"/><text x="150" y="420" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#93a3b8">○</text><text x="215" y="418" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17243b">Load playlist / M3U URL</text><text x="215" y="452" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#60748f">Choose this only if your provider gave you a full M3U playlist link</text><text x="110" y="548" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#60748f">The exact wording can vary between app versions and devices.</text></svg>