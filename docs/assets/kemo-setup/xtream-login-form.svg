<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Enter your Kemo login details</title><desc id="desc">Illustrative Xtream Codes login form showing profile name, username, password and server URL fields.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f6ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1169df"/><stop offset="1" stop-color="#1644a4"/></linearGradient></defs><rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="64" y="74" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3" fill="#087c78">KEMO IPTV • HOW TO SET UP</text><text x="64" y="145" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14233d">STEP 2  •  COMPLETE THE LOGIN FORM</text><rect x="180" y="180" width="840" height="430" rx="16" fill="#17243b" stroke="#17243b" stroke-width="2"/><text x="600" y="228" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">ADD YOUR PLAYLIST</text><text x="250" y="285" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c8d7ee">ANY NAME</text><rect x="250" y="300" width="700" height="43" rx="7" fill="#fff"/><text x="270" y="329" font-family="Arial" font-size="18" fill="#687b94">Kemo TV</text><text x="250" y="353" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c8d7ee">USERNAME</text><rect x="250" y="368" width="700" height="43" rx="7" fill="#fff"/><text x="270" y="397" font-family="Arial" font-size="18" fill="#687b94">Your Kemo username</text><text x="250" y="421" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c8d7ee">PASSWORD</text><rect x="250" y="436" width="700" height="43" rx="7" fill="#fff"/><text x="270" y="465" font-family="Arial" font-size="18" fill="#687b94">Your Kemo password</text><text x="250" y="489" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c8d7ee">SERVER URL</text><rect x="250" y="504" width="700" height="43" rx="7" fill="#fff"/><text x="270" y="533" font-family="Arial" font-size="18" fill="#687b94">Full server address from Kemo</text><rect x="250" y="565" width="700" height="34" rx="7" fill="url(#blue)"/><text x="600" y="589" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">ADD USER</text><text x="64" y="650" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#60748f">Example only — never publish your real username, password or server URL.</text></svg>