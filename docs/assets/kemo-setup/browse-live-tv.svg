<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Open Live TV and choose a channel</title><desc id="desc">Illustrative channel browsing flow from Live TV to a category and channel.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f6ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1169df"/><stop offset="1" stop-color="#1644a4"/></linearGradient></defs><rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="64" y="74" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3" fill="#087c78">KEMO IPTV • HOW TO SET UP</text><text x="64" y="145" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14233d">STEP 4  •  FIND A CHANNEL</text><rect x="64" y="185" width="1072" height="420" rx="16" fill="#101a36" stroke="#101a36" stroke-width="2"/><text x="105" y="235" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">LIVE TV</text><rect x="105" y="270" width="285" height="280" rx="16" fill="#fff" stroke="#fff" stroke-width="2"/><text x="140" y="310" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#253650">All channels</text><rect x="118" y="322" width="260" height="45" rx="8" fill="#e8f1ff"/><text x="140" y="358" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1169df">Sports</text><text x="140" y="406" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#253650">News</text><text x="140" y="454" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#253650">Entertainment</text><text x="140" y="502" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#253650">Kids & Family</text><rect x="420" y="270" width="670" height="280" rx="16" fill="#fff" stroke="#fff" stroke-width="2"/><text x="465" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17243b">Choose a channel</text><rect x="455" y="350" width="600" height="36" rx="16" fill="#edf5ff" stroke="#a8c8f4" stroke-width="2"/><text x="480" y="375" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#30445f">Channel 01</text><rect x="455" y="394" width="600" height="36" rx="16" fill="#fff" stroke="#e4eaf2" stroke-width="2"/><text x="480" y="419" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#30445f">Channel 02</text><rect x="455" y="438" width="600" height="36" rx="16" fill="#fff" stroke="#e4eaf2" stroke-width="2"/><text x="480" y="463" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#30445f">Channel 03</text><rect x="455" y="482" width="600" height="36" rx="16" fill="#fff" stroke="#e4eaf2" stroke-width="2"/><text x="480" y="507" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#30445f">Channel 04</text><text x="105" y="585" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#d7e2f4">Select a category, choose a channel, then use the player controls for full screen.</text></svg>