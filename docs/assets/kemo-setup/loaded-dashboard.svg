<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Wait for your playlist to load</title><desc id="desc">Illustrative media-player dashboard after successful sign-in.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f6ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1169df"/><stop offset="1" stop-color="#1644a4"/></linearGradient></defs><rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="64" y="74" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3" fill="#087c78">KEMO IPTV • HOW TO SET UP</text><text x="64" y="145" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14233d">STEP 3  •  WAIT FOR THE ACCOUNT TO LOAD</text><rect x="64" y="185" width="1072" height="420" rx="16" fill="#090b2e" stroke="#090b2e" stroke-width="2"/><text x="105" y="235" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">YOUR MEDIA LIBRARY</text><rect x="105" y="280" width="300" height="190" rx="17" fill="#21c7a0"/><text x="255" y="385" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">LIVE TV</text><rect x="435" y="280" width="300" height="190" rx="17" fill="#f39a2d"/><text x="585" y="385" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">MOVIES</text><rect x="765" y="280" width="300" height="190" rx="17" fill="#7b63d8"/><text x="915" y="385" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">SERIES</text><text x="105" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#d7e2f4">If loading fails, recheck the login fields and ask your provider to confirm the account is active.</text><text x="64" y="650" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#60748f">Illustrative layout — your app version may look different.</text></svg>